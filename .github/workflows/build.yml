name: Build

permissions:
  pull-requests: write
  contents: write

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      # Inject the release version into the binary so `launch-agent
      # --version` reports the real tag (not the default "master"). The
      # leading "v" is stripped because the platform's install script
      # prepends its own "v" when comparing against the release tag.
      - name: Build binaries
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o launch-util-linux-arm64 .
          GOOS=linux GOARCH=arm   go build -ldflags "${LDFLAGS}" -o launch-util-linux-arm .
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o launch-util-linux-amd64 .
          GOOS=linux GOARCH=386   go build -ldflags "${LDFLAGS}" -o launch-util-linux-amd .
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./launch-util-linux-arm64
          asset_name: launch-util-linux-arm64
          asset_content_type: application/octet-stream
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./launch-util-linux-arm
          asset_name: launch-util-linux-arm
          asset_content_type: application/octet-stream
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./launch-util-linux-amd64
          asset_name: launch-util-linux-amd64
          asset_content_type: application/octet-stream
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./launch-util-linux-amd
          asset_name: launch-util-linux-amd
          asset_content_type: application/octet-stream
